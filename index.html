<!DOCTYPE html>
<html>
<head>
  <title>How many days can you keep this tab open?</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 2rem;
      user-select: none;
    }

    #timer {
      margin-top: 20px;
      font-size: 2.5rem;
      color: #0f0;
    }
  </style>
</head>

<body>

  <div>How many days can you keep this tab open?</div>
  <div id="timer">0d 0h 0m 0s</div>

<script>
  let startTime = Date.now();
  let notificationShown = false;

  // Request notification permission when the page is opened.
  async function requestNotificationPermission() {
    if (!("Notification" in window)) {
      console.log("This browser does not support notifications.");
      return;
    }

    if (Notification.permission === "default") {
      await Notification.requestPermission();
    }
  }

  requestNotificationPermission();

  function updateTimer() {
    const now = Date.now();
    const diff = now - startTime;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    document.getElementById("timer").textContent =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;

    // Send notification after 2 minutes.
    if (diff >= 2 * 60 * 1000 && !notificationShown) {
      notificationShown = true;

      if (Notification.permission === "granted") {
        new Notification("⚠️ Security Alert", {
          body: "Shadow_1002 has breached your computer!"
        });
      }
    }
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
